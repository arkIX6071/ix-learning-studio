# IXLS 006F -- MANUAL-ONLY GitHub Pages release.
# IMPORTANT: Owner must first switch Settings > Pages > Source to GitHub Actions
# while keeping the current live site verified. Do not push to main while Pages
# still uses "Deploy from a branch", as that push would automatically publish.
name: IXLS Manual Pages Release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'FULL 40-char approved commit SHA on main (must equal selected workflow SHA)'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_PUBLIC to acknowledge public publication'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: ixls-pages-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build allowlisted site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Validate full reviewed commit and explicit approval
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
          OWNER_CONFIRM: ${{ inputs.confirmation }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Must provide full SHA'; exit 1; }
          [[ "$OWNER_CONFIRM" == 'DEPLOY_PUBLIC' ]] || { echo 'Explicit confirmation required'; exit 1; }
          [[ "${REVIEWED_SHA,,}" == "$EVENT_SHA" ]] || { echo 'Reviewed SHA differs from selected workflow commit'; exit 1; }
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source hash and deployment policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ixls_release.py verify --root .
      - name: Test security and publishing guards
        shell: bash
        run: python3 -m unittest discover -s tests -p test_release_guard.py -v
      - name: Stage only public files and verify links
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ixls_release.py build --root . --out "${RUNNER_TEMP}/ixls-site-stage"
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exactly the checked artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ixls-site-stage
      - name: Record release SHA
        id: sha
        shell: bash
        run: echo "value=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy after manual trigger and environment approval
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
